name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The sibling robolibs crates are git dependencies; fail fast on a bad fetch
  # instead of hanging a runner.
  CARGO_NET_RETRY: 3

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check (all adapters)
        run: cargo check --all-targets --features "peerbus rest robo xmlt"

      - name: Check (python bindings)
        run: cargo check --features python

      - name: Clippy
        run: cargo clippy --all-targets --features "peerbus rest robo xmlt" -- -D warnings

      - name: Format
        run: cargo fmt --package syncbot -- --check

      - name: Test (all adapters)
        run: cargo test --all-targets --features "peerbus rest robo xmlt"

      # The visualizer is feature-gated out of the default build, so it needs
      # its own check or it silently rots.
      - name: Check the rerun visualizer
        run: cargo check --example fleet_viz --features "rerun-viz peerbus"

      - name: Python adapter self-check
        run: make check-python-adapter

  # Short fuzz smoke: enough to catch a target that stopped building or that
  # crashes on its own corpus, not a real campaign. Run `make fuzz-all` locally
  # for that.
  fuzz:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz (smoke)
        run: |
          cd fuzz
          for target in workspace_push canonical_datapod; do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
          done

  usecase:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The live REST/XML curl battery from misc/USECASE.typ. The ROS2 and
      # mixed batteries need a ROS install and are left to run locally.
      - name: REST/XML usecase battery
        run: make test-usecase-rest

[package]
name = "syncbot"
version = "0.1.4"
edition = "2024"
description = "Rust multi-robot navigation, claims, and scheduling library on top of zoneout"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]
peerbus = ["dep:peerbus", "dep:tracing", "dep:blake3"]
rest = ["peerbus", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing-subscriber"]
xmlt = ["peerbus", "dep:axum", "dep:quick-xml"]
# Keep the rerun example out of default `cargo build --examples` /
# `cargo test --all-targets`; `--all-features` intentionally enables it.
rerun-viz = ["dep:rerun"]

[dependencies]
zoneout = { git = "https://github.com/robolibs/zoneout", tag = "v0.1.3" }
concord = { git = "https://github.com/robolibs/concord", tag = "v0.1.6" }
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.6.2" }
graphix = { git = "https://github.com/robolibs/graphix", tag = "v0.1.6" }
authbox = { git = "https://github.com/robolibs/authbox", tag = "v0.1.2" }
keylock = { git = "https://github.com/robolibs/keylock", tag = "0.1.1" }
peerbus = { git = "https://github.com/robolibs/peerbus", tag = "v0.4.2", optional = true, default-features = false }
axum = { version = "0.8.9", optional = true }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "macros", "net", "time", "signal"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
blake3 = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"], optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"], optional = true }
rerun = { version = "0.31.2", default-features = false, features = [
    "sdk",
    "server",
], optional = true }

[dev-dependencies]
# Same version the sibling crates use (machbus, peerbus).
proptest = "1"

# The server: REST (+ XML) over a workspace, `syncbot [workspace_dir] [bind]`.
[[bin]]
name = "syncbot"
path = "src/bin/syncbot.rs"
required-features = ["rest"]

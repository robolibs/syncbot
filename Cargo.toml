[package]
name = "syncbot"
version = "0.1.3"
edition = "2024"
description = "Rust multi-robot navigation, claims, and scheduling library on top of zoneout"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]
peerbus = ["dep:peerbus", "dep:tracing"]
rest = ["peerbus", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing-subscriber"]
robo = ["peerbus", "dep:tokio", "dep:zenoh"]
xmlt = ["peerbus", "dep:axum", "dep:quick-xml"]
# Keep the rerun example out of default `cargo build --examples` /
# `cargo test --all-targets`; `--all-features` intentionally enables it.
rerun-viz = ["dep:rerun"]

[dependencies]
zoneout = { git = "https://codeberg.org/robolibs/zoneout.git", tag = "0.1.2" }
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.2" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.1" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", tag = "0.1.2" }
authbox = { git = "https://codeberg.org/robolibs/authbox.git", tag = "0.1.1" }
keylock = { git = "https://codeberg.org/robolibs/keylock.git", tag = "0.1.1" }
peerbus = { git = "https://codeberg.org/robolibs/peerbus", tag = "0.4.1", optional = true, default-features = false }
axum = { version = "0.8.9", optional = true }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "macros", "net", "time", "signal"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"], optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
zenoh = { version = "1.9.0", optional = true }
quick-xml = { version = "0.36", features = ["serialize"], optional = true }
rerun = { version = "0.31.2", default-features = false, features = [
    "sdk",
    "server",
], optional = true }

[dev-dependencies]
# Same version the sibling crates use (machbus, peerbus).
proptest = "1"

[[example]]
name = "fleet_viz"
required-features = ["rerun-viz", "peerbus"]

[[example]]
name = "rest_server"
required-features = ["rest"]

[[example]]
name = "serve_workspace"
required-features = ["rest"]
